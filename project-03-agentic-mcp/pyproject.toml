[project]
name = "project-03-agentic-mcp"
version = "0.1.0"
description = "3-agent research pipeline with MCP tool integration"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
